<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>福岡小旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700&family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1a1a1a;--mute:#8a8a86;--line:#e6e6e2;--soft:#f0f0ec;--acc:#1a1a1a;--ok:#2f7d5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans","Noto Sans SC",sans-serif;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(90px + env(safe-area-inset-bottom)) env(safe-area-inset-left);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px}
header{text-align:center;padding-top:10px}
header h1{margin:0;font-size:42px;line-height:1.15;font-weight:400;letter-spacing:1px;color:#4a4542}
header h1 .zh{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;font-weight:700;font-size:44px}
header h1 .en{font-family:"Baloo 2",sans-serif;font-weight:700;margin-left:6px;color:#4a4542}
header .dt{color:var(--mute);font-size:13px;margin-top:6px}
.wx{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0 4px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.wd .d{font-size:15px;font-weight:600}
.wd .w{font-size:11px;color:var(--mute);margin-top:1px}
.wd .t{font-size:13px;margin-top:8px;font-variant-numeric:tabular-nums}
.wd .t span{color:var(--mute)}
.wd .c{font-size:10px;color:var(--mute);margin-top:6px;height:12px}
.wd.today{border-color:var(--ink)}
.wxrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 2px 0}
.wxn{font-size:11px;color:var(--mute)}
.wxa{flex:none;font-size:12px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px}
.wd .cd{font-size:11px;color:#55554f;margin-top:4px;min-height:14px;line-height:1.3}
.wd .pp{font-size:10px;color:var(--mute);margin-top:2px;min-height:12px}
.grp{margin-top:26px}
.gh{display:flex;align-items:center;gap:8px;margin:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;-webkit-user-select:none;user-select:none}
.gh .dot{width:8px;height:8px;border-radius:50%;flex:none}
.gh .n{color:#8a8a86}
.gh .cv{color:#b5b5ae;font-size:13px;transition:transform .2s;margin-left:6px}
.grp.open .gh .cv{transform:rotate(90deg)}
.grp .items{display:none;margin-top:8px}
.grp.open .items{display:block}
.grp{margin-top:10px}
.gh h2{margin:0;font-size:15px;font-weight:600;letter-spacing:2px}
.gh .n{margin-left:auto;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;display:flex;gap:12px;align-items:center}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid #c8c8c2;background:#fff;display:grid;place-items:center;cursor:pointer;transition:all .15s;padding:0}
.chk svg{width:13px;height:13px;opacity:0}
.card.done .chk{background:var(--ink);border-color:var(--ink)}
.card.done .chk svg{opacity:1}
.card.done .nm{color:var(--mute)}
.body{flex:1;min-width:0;cursor:pointer}
.body .nm{font-weight:600;font-size:15px}
.body .sb{font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.body .memo{font-size:12px;margin-top:6px;color:#55554f;border-left:2px solid var(--line);padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:11px;color:var(--mute);margin-left:6px;font-weight:400}
.arrow{flex:none;color:#c8c8c2;font-size:20px;cursor:pointer;padding:0 2px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));z-index:5;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:13px 28px;font-size:15px;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.foot{font-size:11px;color:var(--mute);text-align:center;margin-top:26px;line-height:1.7}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;z-index:9}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:18px 18px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom));z-index:10;transform:translateY(105%);transition:transform .22s ease;max-height:88vh;overflow:auto;max-width:600px;margin:0 auto}
.sheet.on{transform:none}.mask.on{display:block}
.grab{width:36px;height:4px;border-radius:4px;background:#d6d6d0;margin:4px auto 14px}
.x{position:absolute;right:14px;top:12px;border:0;background:transparent;font-size:15px;color:var(--mute);cursor:pointer;padding:8px}
.sh-h{margin:0 2px 14px}
.sh-h .nm{font-size:20px;font-weight:700}
.sh-h .sb{font-size:12px;color:var(--mute);margin-top:3px}
.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.box h4{margin:0 0 10px;font-size:12px;color:var(--mute);font-weight:500;letter-spacing:2px}
.info{font-size:13px;line-height:1.65}
.stamp{width:100%;border:1px solid var(--ink);border-radius:10px;padding:12px;font-size:15px;cursor:pointer;background:#fff;color:var(--ink)}
.stamp.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{font-size:11px;color:var(--mute);margin-top:6px}
textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;color:var(--ink);background:#fcfcfa;resize:vertical}
textarea:focus{outline:none;border-color:var(--ink)}
.saved{font-size:11px;color:var(--mute);text-align:right;height:14px;margin-top:4px}
.two{display:flex;gap:8px}
.btn{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;cursor:pointer;background:#fff;color:var(--ink);text-align:center;text-decoration:none;display:block}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.sel{display:flex;flex-direction:column;gap:6px;position:relative}
.pick{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.pick.act{border-color:var(--ink)}
.pick .l{font-size:12px;color:var(--mute);width:30px}
.pick .v{font-weight:600;flex:1}.pick .v.ph{color:#b9b9b3;font-weight:400}
.swap{position:absolute;right:14px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:#fff;color:var(--ink);width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;z-index:1}
.plist .gl{font-size:11px;color:var(--mute);margin:14px 2px 6px;letter-spacing:2px}
.res{margin-top:14px}
.tabs{display:flex;background:var(--soft);border-radius:10px;padding:3px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:9px 6px;font-size:14px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tabs small{display:block;font-size:11px;margin-top:2px}
.steps{list-style:none;margin:0 0 6px;padding:0}
.steps li{position:relative;padding:0 0 14px 24px;font-size:14px;line-height:1.5}
.steps li:before{content:"";position:absolute;left:5px;top:9px;bottom:-5px;width:2px;background:var(--c,#dcdcd6)}
.steps li:last-child:before{display:none}
.steps li .dot{position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2.5px solid var(--c,#c8c8c2)}
.steps li .k{font-size:11px;color:var(--mute);letter-spacing:1px;margin-right:6px}
.steps li .m{color:var(--mute);font-size:12px}
.steps li .h{display:block;color:var(--mute);font-size:12px}
.tip{font-size:13px;background:var(--soft);border-radius:10px;padding:10px 12px;margin:4px 0 12px;line-height:1.6;color:#44443f}
.empty{text-align:center;color:var(--mute);font-size:13px;padding:22px 0 8px}
.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-size:13px;z-index:20;transition:transform .25s}
.toast.on{transform:translate(-50%,0)}
.addr{background:#fff;border:1px solid var(--ink);border-radius:12px;padding:14px;margin-bottom:10px}
.addr .lb{font-size:11px;color:var(--mute);letter-spacing:2px;margin-bottom:6px}
.addr .tx{font-size:16px;line-height:1.55;font-weight:600;word-break:break-all;-webkit-user-select:text;user-select:text}
.addr .row2{display:flex;gap:8px;margin-top:10px}
.addr .row2 button,.addr .row2 a{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px;font-size:13px;color:var(--ink);text-align:center;text-decoration:none;cursor:pointer}
.lchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px;margin:0 6px 6px 0}
.lchip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.near{list-style:none;margin:0;padding:0}
.near li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.near li:first-child{border-top:0}
.near li span{color:var(--mute);font-size:12px;white-space:nowrap}
.sub-h{font-size:11px;color:var(--mute);letter-spacing:2px;margin:6px 0 2px}
.doc{display:flex;gap:12px;align-items:center;cursor:pointer}
.doc img{width:64px;height:auto;border:1px solid var(--line);border-radius:6px;flex:none;background:#fff}
.doc .dt{font-size:14px;font-weight:600}
.doc .di{font-size:12px;color:var(--mute);margin-top:3px;line-height:1.5}
.doc .dl{font-size:12px;color:var(--ink);margin-top:6px;text-decoration:underline}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:30;display:none;flex-direction:column}
.lb.on{display:flex}
.lb .bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;color:#fff;font-size:14px}
.lb .bar button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:999px;padding:8px 14px;font-size:13px;margin-left:6px;cursor:pointer}
.lb .wrapimg{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:0 10px calc(16px + env(safe-area-inset-bottom))}
.lb img{display:block;width:100%;height:auto;margin:0 auto;background:#fff;border-radius:4px}
.lb.zoom img{width:200%;max-width:none}
.edbtn{float:right;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink);cursor:pointer;margin-left:8px}
.ef label{display:block;font-size:11px;color:var(--mute);letter-spacing:2px;margin:10px 0 4px}
.ef input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;color:var(--ink);background:#fcfcfa}
.ef input:focus{outline:none;border-color:var(--ink)}
.ef .two{margin-top:12px}
.edited{font-size:11px;color:var(--mute);margin-top:4px}
.info,.pv{white-space:pre-wrap;word-break:break-word}
#efT{min-height:140px}
.hl-bd{font-weight:700}.hl-r{color:#e03131}.hl-b{color:#1c7ed6}.hl-g{color:#2f9e44}.hl-o{color:#e8590c}.hl-y{background:#ffe066;border-radius:3px;padding:0 2px}
.cbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.cbar button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.cbar .lbl{font-size:11px;color:var(--mute);width:100%}
.pv{margin-top:10px;font-size:13px;line-height:1.6;background:var(--soft);border-radius:10px;padding:10px}
.hdeco{position:relative}
.hdeco .d1,.hdeco .d2,.hdeco .d3,.hdeco .d4{position:absolute;pointer-events:none}
.hdeco .d1{left:6px;top:2px;width:34px}
.hdeco .d2{right:4px;top:4px;width:44px}
.hdeco .d3{right:18px;top:52px;width:10px}
.hdeco .d4{left:36px;top:40px;width:20px}
.wave{display:block;margin:10px auto 0;width:120px;height:10px}
.gh .ic{width:22px;height:22px;flex:none}
.foot svg{display:block;margin:0 auto 8px;width:70px}
.fl{margin-top:14px}
.flh{font-size:11px;color:var(--mute);letter-spacing:2px;margin:0 2px 4px}
.tk{display:flex;align-items:center;gap:8px;padding:7px 12px;margin-bottom:5px;border:2px solid #006564;border-radius:10px;background:#fff;font-size:12px;color:#55504c;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.tk .no{font-weight:600;color:#55504c;min-width:44px}
.tk .dt2{min-width:62px}
.tk .rt{flex:1}
.tk .ar{margin-left:auto}
.lk{display:block;border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;margin-top:8px;font-size:14px;color:var(--ink);text-decoration:none}
.lk small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv b{font-weight:400;color:var(--mute);font-size:12px;align-self:center}
</style>
</head>

// ===== Engine =====
function hav(a,b){const R=6371000,t=x=>x*Math.PI/180;const dLa=t(b.lat-a.lat),dLo=t(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const WALK_FIX={'hotel|cdg':4};
function walkInfo(a,b){const m=hav(a,b)*1.25;const k1=a.id+'|'+b.id,k2=b.id+'|'+a.id;const fx=WALK_FIX[k1]||WALK_FIX[k2];
  const min=fx||Math.max(2,Math.round(m/75)+1);return {meters:Math.round(min*75/10)*10, min};}

function buildGraph(){
  const g={};const add=(u,v,w,e)=>{(g[u]=g[u]||[]).push({v,w,...e});};
  for(const L of LINES){
    const s=L.stops;
    for(let i=0;i<s.length;i++)for(let j=0;j<s.length;j++){ if(i===j)continue; if(L.dir==='fwd'&&j<i)continue;
      add(s[i][0], s[j][0], Math.abs(s[j][1]-s[i][1])+L.wait, {type:'ride',line:L,ride:Math.abs(s[j][1]-s[i][1]),stops:Math.abs(j-i)});}
  }
  for(const [a,b,w] of TRANSFERS){add(a,b,w,{type:'transfer'});add(b,a,w,{type:'transfer'});}
  return g;
}

const GRAPH=buildGraph();

function route(fromId,toId){
  const A=PLACES.find(p=>p.id===fromId),B=PLACES.find(p=>p.id===toId);
  const dist={},prev={};const Q=new Set();
  const g=JSON.parse(JSON.stringify({}));
  // start edges
  const start='@'+A.id,end='@'+B.id;
  dist[start]=0;Q.add(start);
  const edges=u=>{
    if(u===start) return Object.entries(A.access).map(([v,w])=>({v,w,type:'walkin'}));
    const out=(GRAPH[u]||[]).slice();
    if(B.access[u]!=null) out.push({v:end,w:B.access[u],type:'walkout'});
    return out;
  };
  const done=new Set();
  while(true){
    let u=null,best=Infinity;for(const k of Q){if(dist[k]<best){best=dist[k];u=k;}}
    if(u===null)break; Q.delete(u); if(done.has(u))continue; done.add(u);
    if(u===end)break;
    for(const e of edges(u)){
      // forbid two rides on same line consecutively handled naturally
      const nd=dist[u]+e.w; if(dist[e.v]==null||nd<dist[e.v]){dist[e.v]=nd;prev[e.v]={u,e};Q.add(e.v);}
    }
  }
  if(dist[end]==null) return null;
  const steps=[];let cur=end;while(cur!==start){const p=prev[cur];steps.unshift({from:p.u,to:cur,...p.e});cur=p.u;}
  // merge consecutive walks
  const out=[];
  for(const s of steps){
    if(s.type==='ride'){out.push({kind:'ride',line:s.line,from:STATIONS[s.from],to:STATIONS[s.to],min:s.ride,stops:s.stops,wait:s.line.wait});}
    else{
      const label = s.type==='walkin'?`走到${STATIONS[s.to]}`: s.type==='walkout'?`下車後走到目的地`:`換乘：走到${STATIONS[s.to]}`;
      const last=out[out.length-1];
      if(last&&last.kind==='walk'){last.min+=s.w;last.label=label;} else out.push({kind:'walk',min:s.w,label});
    }
  }
  const rides=out.filter(s=>s.kind==='ride').length;
  return {total:dist[end], steps:out, rides};
}

    };});
    const es=document.getElementById('efSave'); if(es) es.onclick=()=>{const b=ORIG[p.id], o={};
      const n=$('#efN').value.trim(), su=$('#efS').value.trim(), no=$('#efT').value.trim();
      if(n&&n!==b.name) o.name=n; if(su!==b.sub) o.sub=su; if(no!==b.note) o.note=no;
      if(Object.keys(o).length) OV[p.id]=o; else delete OV[p.id];
      applyOV(); editing=false; saveOV(); renderMain(); renderPlace(); toast('已保存');};
    const ec=document.getElementById('efCancel'); if(ec) ec.onclick=()=>{editing=false; renderPlace();};
    const er=document.getElementById('efReset'); if(er) er.onclick=()=>{delete OV[p.id]; applyOV(); editing=false; saveOV(); renderMain(); renderPlace(); toast('已恢復');};
    document.querySelectorAll('[data-doc]').forEach(el=>el.onclick=()=>{const d=p.docs[+el.dataset.doc]; $('#lbI').src=d.full; $('#lbT').textContent=d.title; $('#lb').classList.remove('zoom'); $('#lbZ').textContent='放大'; $('#lb').classList.add('on');});
    const nl=document.querySelector('.near'); if(nl) nl.onclick=e=>{const li=e.target.closest('[data-goto]'); if(li){openPlace(li.dataset.goto); $('#sheet').scrollTop=0;}};
    $('#rFrom').onclick=()=>openRoute(curPlace,null);
    $('#rTo').onclick=()=>openRoute(null,curPlace);
  }

  let R={from:null,to:null,picking:null,mode:null};
  function openRoute(f,t){ R={from:f,to:t,picking:f&&!t?'to':(!f?'from':null),mode:null}; sheetMode='route'; renderRoute(); openSheet(); }
  $('#fab').onclick=()=>openRoute(null,null);
  const gmMe=(b,m)=>`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(b.q)}&travelmode=${m}`;
  const gm=(a,b,m)=>`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(a.q)}&destination=${encodeURIComponent(b.q)}&travelmode=${m}`;
  function stepsHTML(r){
    return '<ol class="steps">'+r.steps.map(s=>{
      if(s.kind==='walk') return `<li><span class="dot"></span><span class="k">步行</span>${esc(s.label)} <span class="m">· 約 ${s.min} 分鐘</span></li>`;
      const L=s.line,isBus=/巴士/.test(L.name);
      return `<li style="--c:${L.color}"><span class="dot"></span><span class="k">${isBus?'巴士':'乘車'}</span><b>${L.name}</b><br>${s.from} → ${s.to} <span class="m">· 車程約 ${s.min} 分鐘${s.stops&&!isBus?` · ${s.stops} 站`:''}</span>${L.hint?`<span class="h">${L.hint}</span>`:''}</li>`;
    }).join('')+'<li><span class="dot" style="border-color:var(--ink)"></span>到達</li></ol>';
  }
  function extraTip(a,b){
    const ids=[a.id,b.id];
    if(ids.includes('airport')) return '帶行李的話，打車約 15 分鐘（大約 1,500–2,000 日元）最省力；也可以坐直達巴士往返博多站，約 20–25 分鐘。';
    if(ids.includes('sidef')) return '另一個選擇：在博多站坐西鉄巴士直達 LaLaport 門口，約 20 分鐘，不用走路。';
    if(ids.includes('yame')) return '路程很遠，建議早上出發。到了羽犬塚站如果巴士要等很久，直接打車約 15 分鐘。也可以坐西鉄電車到久留米，再轉巴士。';
    if(ids.includes('dazaifu')) return '電車和巴士都可以。電車要在二日市站換車；巴士在博多巴士總站上車，直達不用換，但班次比較少。';
    return '';
  }
  function pickList(exclude){
    const me = R.picking==='from' ? `<div class="gl">當前位置</div><div class="chips" style="margin-top:0"><button class="chip" data-pk="__me">我現在的位置</button></div>` : '';
    return '<div class="plist">'+me+GROUPS.map(g=>{const items=g.ids.filter(i=>i!==exclude); if(!items.length) return '';
      return `<div class="gl">${g.name}</div><div class="chips" style="margin-top:0">${items.map(i=>`<button class="chip" data-pk="${i}">${fmt(byId(i).name)}</button>`).join('')}</div>`;}).join('')+'</div>';
  }
  function renderRoute(){
    const ME={id:'__me',name:'我現在的位置'};
    const f=R.from==='__me'?ME:(R.from&&byId(R.from)), t=R.to&&byId(R.to);
    let h=`<div class="sh-h"><div class="nm">查路線</div><div class="sb">選擇出發地和目的地</div></div>`;
    h+=`<div class="sel"><div class="pick ${R.picking==='from'?'act':''}" data-slot="from"><span class="l">出發</span><span class="v ${f?'':'ph'}">${f?fmt(f.name):'點這裡選擇'}</span></div>`+
       `<button class="swap" id="swap" aria-label="交換">⇅</button>`+
       `<div class="pick ${R.picking==='to'?'act':''}" data-slot="to"><span class="l">到達</span><span class="v ${t?'':'ph'}">${t?fmt(t.name):'點這裡選擇'}</span></div></div>`;
    if(R.picking){ h+=pickList(R.picking==='from'?R.to:R.from); }
    else if(f&&t&&f.id==='__me'){
      const d=t;
      h+=`<div class="res"><div class="tip">這個網頁沒辦法讀取手機定位，所以從你現在的位置出發的路線和時間，要用 Google Maps 看（會自動用你的定位）。<br>如果你就在某個收藏地點附近，也可以直接把那個地點選為出發地，在這裡看估算時間。</div>`+
        `<div class="two" style="margin-bottom:8px"><a class="btn dark" href="${gmMe(d,'transit')}" target="_blank" rel="noopener">公共交通導航</a><a class="btn" href="${gmMe(d,'walking')}" target="_blank" rel="noopener">步行導航</a></div>`+
        `<a class="btn" href="${gmMe(d,'driving')}" target="_blank" rel="noopener">打車 / 開車路線</a></div>`;
    }
    else if(f&&t){
      const w=walkInfo(f,t), r=route(f.id,t.id), onlyWalk=!r||r.rides===0, tt=onlyWalk?null:r.total;
      const walkBest=onlyWalk||w.min<=tt, longWalk=w.min>35;
      const m=R.mode||(walkBest?'walk':'transit');
      h+=`<div class="res"><div class="tabs"><button data-m="walk" class="${m==='walk'?'on':''}">步行<small>${longWalk?'太遠 · ':''}約 ${w.min} 分鐘</small></button>`+
        `<button data-m="transit" class="${m==='transit'?'on':''}">公共交通<small>${onlyWalk?'不用坐車':'約 '+tt+' 分鐘'}</small></button></div>`;
      if(m==='walk') h+= longWalk?`<div class="tip">走路要 ${w.min} 分鐘左右，太遠了，建議坐車。</div>`:`<div class="tip">直接走過去就好，大約 ${(w.meters/1000).toFixed(1)} km。</div>`;
      else { h+= onlyWalk?`<div class="tip">很近，坐車反而更慢，走路約 ${w.min} 分鐘就到。</div>`:stepsHTML(r); const x=extraTip(f,t); if(x) h+=`<div class="tip">${x}</div>`; }
      h+=`<a class="btn dark" href="${gm(f,t,m==='walk'?'walking':'transit')}" target="_blank" rel="noopener">在 Google Maps 打開導航</a></div>`;
    } else h+=`<div class="empty">選好出發地和目的地就會顯示路線</div>`;
    $('#sc').innerHTML=h;
  }
  $('#sc').addEventListener('click',e=>{
    if(sheetMode!=='route') return;
    const sl=e.target.closest('[data-slot]'); if(sl){R.picking= R.picking===sl.dataset.slot?null:sl.dataset.slot; renderRoute(); return;}
    if(e.target.closest('#swap')){[R.from,R.to]=[R.to,R.from]; R.mode=null; renderRoute(); return;}
    const pk=e.target.closest('[data-pk]'); if(pk){R[R.picking]=pk.dataset.pk; R.mode=null;
      R.picking= !R.from?'from':!R.to?'to':null; renderRoute(); return;}
    const md=e.target.closest('[data-m]'); if(md){R.mode=md.dataset.m; renderRoute();}
  });

  $('#lbX').onclick=()=>$('#lb').classList.remove('on');
  $('#lbZ').onclick=()=>{const z=$('#lb').classList.toggle('zoom'); $('#lbZ').textContent=z?'縮小':'放大';};
  renderMain();
})();
</script>
</body>
</html>
